services:
  - type: web
    name: last-bench-api
    env: node
    plan: free
    region: singapore
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://tocxdyqlrvzthpexnmxe.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_uLq6k_t3B-dnNJW9d1Kh-Q_3kyoSUa_
      - key: FRONTEND_URL
        value: https://lastbenchbd.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://lastbenchbd.com
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: ADMIN_AUTH_USER_ID
        sync: false
      - key: OPENAI_API_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_GUIDANCE_MODEL
        value: gpt-5.6-terra
