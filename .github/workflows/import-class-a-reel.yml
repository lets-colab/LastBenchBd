name: Import CLASS Lambda Masterclass Reel

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-class-a-reel.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install reel tooling
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check --quiet yt-dlp

      - name: Download approved masterclass reel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p landing/class-a/assets
          yt-dlp             --no-playlist             --format "bv*[height<=1280]+ba/b[height<=1280]/b"             --merge-output-format mp4             --output "landing/class-a/assets/masterclass-entry.%(ext)s"             "https://www.instagram.com/reel/Dc8gshzz5oF/"
          test -s landing/class-a/assets/masterclass-entry.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 landing/class-a/assets/masterclass-entry.mp4

      - name: Commit reel and remove one-time importer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-class-a-reel.yml
          git config user.name "Last Bench Release Bot"
          git config user.email "252910500+lets-colab@users.noreply.github.com"
          git add landing/class-a/assets/masterclass-entry.mp4 .github/workflows/import-class-a-reel.yml
          git commit -m "Import CLASS Lambda masterclass entry reel"
          git push origin HEAD:main
