name: Deploy Netlify Production

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-netlify-production.yml"
      - "landing/**"
      - "app/**"
      - "assets/**"
      - "scripts/build-site.mjs"
      - "netlify.toml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 04a1423a-961c-4b5e-bb4b-53db3027317e

    steps:
      - name: Verify deployment authorization
        shell: bash
        run: |
          if [[ -z "$NETLIFY_AUTH_TOKEN" ]]; then
            echo "::error::NETLIFY_AUTH_TOKEN is not configured in GitHub Actions. Production cannot be updated safely from CI."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build complete production site
        run: pnpm build:web:production

      - name: Deploy exact build to canonical Netlify site
        run: >-
          npx --yes netlify-cli@latest deploy
          --dir=dist
          --prod
          --site="$NETLIFY_SITE_ID"
          --message="GitHub ${GITHUB_SHA}"
