name: Deploy Netlify Production (Legacy Manual Fallback)

# Netlify is no longer the automatic production path.
# GitHub Pages is the primary production deploy target.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Netlify automatic production deployment is retired."
          echo "Use Deploy GitHub Pages Production for production releases."
