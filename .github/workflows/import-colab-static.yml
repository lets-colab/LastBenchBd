name: One-time import of public co.lab build into Last Bench Pages
on:
  push:
    branches: [fix/colab-pages-and-public-routes-20261123]
    paths: [".github/workflows/import-colab-static.yml"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Import independently built static-only Co.Lab artifact
        env:
          PUBLIC_SITE_EXPORT: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-bcb4-8211-b641-abb6020e366f/raw?se=2026-11-23T12%3A40%3A04Z&sp=r&sv=2026-06-06&sr=b&scid=27a20aa4-52cb-5903-8291-2fc4de8e3d5c&skoid=c094fe1e-1dc0-485a-8de0-10ab942be48f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-23T00%3A43%3A51Z&ske=2026-11-24T00%3A43%3A51Z&sks=b&skv=2026-06-06&sig=5CGq4m6OvKn7P2Q1LKs%2BV4yMEDF60J%2Bj0wF2AuijXkQ%3D"
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --max-time 60 "$PUBLIC_SITE_EXPORT" -o /tmp/co-lab-export.zip
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import sys
          archive=Path('/tmp/co-lab-export.zip')
          target=Path('landing/co-lab/growth-os')
          allowed={'index.html','404.html','lab-preview.html','robots.txt','favicon.ico','placeholder.svg','creators/index.html'}
          with ZipFile(archive) as z:
              members=z.namelist()
              assert 'index.html' in members, 'compiled home missing'
              assert 'creators/index.html' in members, 'creators route missing'
              assert any(x.endswith('.js') and x.startswith('assets/') for x in members), 'javascript missing'
              assert any(x.endswith('.css') and x.startswith('assets/') for x in members), 'styles missing'
              for name in members:
                  p=PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts, 'unsafe archive path'
                  assert name in allowed or name.startswith('assets/'), 'unapproved public build entry: '+name
                  if name.endswith('/'):continue
                  out=target.joinpath(*p.parts)
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(z.read(name))
          for name in ('index.html','creators/index.html'):
              content=(target/name).read_text(encoding='utf-8')
              assert '/co-lab/growth-os/assets/' in content, 'wrong Vite asset base'
              assert 'The Growth Operating System for Modern Brands' in content, 'missing canonical site title'
          gallery=target/'lab-preview.html'
          if gallery.is_file():
              content=gallery.read_text(encoding='utf-8')
              content=content.replace('https://co-lab-growth-os.lovable.app/', '/co-lab/growth-os/')
              content=content.replace('https://co-lab-growth-os.lovable.app', '/co-lab/growth-os/')
              assert 'co-lab-growth-os.lovable.app' not in content
              gallery.write_text(content, encoding='utf-8')
          all_files=list(target.rglob('*'))
          assert len([p for p in all_files if p.is_file()])>=8
          print('PASS static Co.Lab export with '+str(len(all_files))+' entries and no private repo source')
          PY
      - name: Commit generated public assets on isolated branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add landing/co-lab/growth-os
          git diff --cached --check
          git commit -m 'feat: import verified Co.Lab static build for GitHub Pages'
          git push origin HEAD:fix/colab-pages-and-public-routes-20261123
