name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Production dependency audit (critical only)
        run: pnpm audit --prod --audit-level critical

      - name: Build API server
        run: |
          pnpm build
          test -s server-dist/index.js
          test -s server-dist/data/malaysia-universities.json

      - name: Start built API and verify health
        env:
          NODE_ENV: production
          PORT: "3000"
          DATABASE_URL: postgres://ci:ci@db.example.invalid:5432/postgres
          JWT_SECRET: ci-release-smoke-secret-that-is-at-least-32-characters
          OAUTH_SERVER_URL: https://oauth.example.invalid
          VITE_APP_ID: ci-app-id
          OWNER_OPEN_ID: ci-owner-id
          FRONTEND_URL: https://web.example.invalid
          CORS_ALLOWED_ORIGINS: https://web.example.invalid
          BUILT_IN_FORGE_API_URL: https://forge.example.invalid
          BUILT_IN_FORGE_API_KEY: ci-forge-key
          AI_GUIDANCE_MODEL: ci-model
        run: |
          set -euo pipefail
          pnpm start > /tmp/lastbench-api.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            cat /tmp/lastbench-api.log
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health | grep -q '"ok":true'; then
              echo "Built API startup smoke passed"
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Built API exited before health became ready"
              exit 1
            fi
            sleep 1
          done

          echo "Built API did not become healthy in time"
          exit 1

      - name: Build complete Netlify site
        run: pnpm build:web:production
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.example.invalid
          EXPO_PUBLIC_OAUTH_PORTAL_URL: https://portal.example.invalid
          EXPO_PUBLIC_OAUTH_SERVER_URL: https://oauth.example.invalid
          EXPO_PUBLIC_APP_ID: ci-app-id
          EXPO_PUBLIC_OWNER_OPEN_ID: ci-owner-id
          EXPO_PUBLIC_OWNER_NAME: Last Bench

      - name: Check patch integrity
        run: git diff --check
