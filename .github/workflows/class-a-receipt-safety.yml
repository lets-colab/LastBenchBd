name: CLASS Receipt Safety
on:
  pull_request:
    paths:
      - 'supabase/functions/class-a-payment-receipt-worker/**'
      - 'scripts/verify_class_a_receipt_safety.py'
      - '.github/workflows/class-a-receipt-safety.yml'
  workflow_dispatch:
jobs:
  static-receipt-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify fail-closed receipt source invariants
        run: python3 scripts/verify_class_a_receipt_safety.py
