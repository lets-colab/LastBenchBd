name: Sync co.lab Cinematic Experience

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-colab-experience.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Last Bench
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Fetch canonical co.lab source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 20 https://github.com/lets-colab/letscolab.git /tmp/colab
          git -C /tmp/colab checkout e0f7a3a34748d83c61d1193ea8c70d5770df0602
          test "$(git -C /tmp/colab rev-parse HEAD)" = "e0f7a3a34748d83c61d1193ea8c70d5770df0602"

      - name: Build co.lab for /colab/
        working-directory: /tmp/colab
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build -- --base=/colab/
          test -f dist/index.html

      - name: Sync exact build into Last Bench
        shell: bash
        run: |
          set -euo pipefail
          rm -rf landing/colab
          mkdir -p landing/colab
          cp -a /tmp/colab/dist/. landing/colab/
          printf '%s\n' 'e0f7a3a34748d83c61d1193ea8c70d5770df0602' > landing/colab/.source-commit
          grep -q '/colab/assets/' landing/colab/index.html

      - name: Commit synced co.lab experience
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Last Bench Release Bot"
          git config user.email "252910500+lets-colab@users.noreply.github.com"
          git pull --rebase origin main
          git add landing/colab
          if git diff --cached --quiet; then
            echo "co.lab route already matches canonical source."
            exit 0
          fi
          git commit -m "Sync premium co.lab cinematic experience"
          git push origin HEAD:main
