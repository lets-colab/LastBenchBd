name: Finalize Custom Domain Cutover

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-custom-domain.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  issues: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DOMAIN: lastbenchbd.com
    steps:
      - name: Configure GitHub Pages custom domain
        id: pages
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/pages.json -w '%{http_code}'             -X PUT             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"             -d '{"cname":"lastbenchbd.com"}')"
          echo "GitHub Pages custom-domain API HTTP $code"
          if [[ "$code" != "200" ]]; then
            cat /tmp/pages.json
            exit 1
          fi

      - name: Cut over Cloudflare web DNS if token is already available
        id: cloudflare
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CF_TOKEN:-}" ]]; then
            echo "No CLOUDFLARE_API_TOKEN repository secret is available."
            exit 2
          fi

          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json")
          zone_json="$(curl -fsS "${auth[@]}" "$api/zones?name=$DOMAIN&status=active")"
          zone_id="$(printf '%s' "$zone_json" | jq -r '.result[0].id // empty')"
          test -n "$zone_id"

          records="$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?per_page=100")"

          # Remove only the two known legacy Netlify apex A records.
          for ip in 75.2.60.5 99.83.231.61; do
            ids="$(printf '%s' "$records" | jq -r --arg ip "$ip" --arg name "$DOMAIN" '.result[] | select(.type=="A" and .name==$name and .content==$ip) | .id')"
            for id in $ids; do
              curl -fsS -X DELETE "${auth[@]}" "$api/zones/$zone_id/dns_records/$id" >/dev/null
            done
          done

          # Ensure the four GitHub Pages apex A records exist.
          records="$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?per_page=100")"
          for ip in 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153; do
            count="$(printf '%s' "$records" | jq -r --arg ip "$ip" --arg name "$DOMAIN" '[.result[] | select(.type=="A" and .name==$name and .content==$ip)] | length')"
            if [[ "$count" == "0" ]]; then
              curl -fsS -X POST "${auth[@]}" "$api/zones/$zone_id/dns_records"                 --data "$(jq -cn --arg name "$DOMAIN" --arg ip "$ip" '{type:"A",name:$name,content:$ip,ttl:1,proxied:false}')" >/dev/null
            fi
          done

          # Move www from Netlify to the GitHub Pages hostname, without touching mail/API.
          records="$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?per_page=100")"
          www_id="$(printf '%s' "$records" | jq -r --arg name "www.$DOMAIN" '.result[] | select(.name==$name and .type=="CNAME") | .id' | head -1)"
          if [[ -n "$www_id" ]]; then
            curl -fsS -X PUT "${auth[@]}" "$api/zones/$zone_id/dns_records/$www_id"               --data "$(jq -cn --arg name "www.$DOMAIN" '{type:"CNAME",name:$name,content:"lets-colab.github.io",ttl:1,proxied:false}')" >/dev/null
          else
            curl -fsS -X POST "${auth[@]}" "$api/zones/$zone_id/dns_records"               --data "$(jq -cn --arg name "www.$DOMAIN" '{type:"CNAME",name:$name,content:"lets-colab.github.io",ttl:1,proxied:false}')" >/dev/null
          fi

          echo "Cloudflare web DNS cutover submitted without changing MX/TXT/api records."

      - name: Summarize cutover authority
        shell: bash
        run: |
          echo "GitHub Pages domain step: ${{ steps.pages.outcome }}"
          echo "Cloudflare DNS step: ${{ steps.cloudflare.outcome }}"
          if [[ "${{ steps.pages.outcome }}" != "success" || "${{ steps.cloudflare.outcome }}" != "success" ]]; then
            echo "One or more account-level permissions are unavailable to this repository token. The scheduled Custom Domain Cutover Watch remains authoritative."
          fi
