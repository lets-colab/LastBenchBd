name: Sync verified Claude Design export

on:
  push:
    branches:
      - design-sync/claude-lastbench-2026-09-08
    paths:
      - .github/workflows/sync-claude-design-export.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: design-sync/claude-lastbench-2026-09-08
          fetch-depth: 0

      - name: Download verified user export from Google Drive
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          gdown --id '1GlFQ6t0A9W3KbDq_7uEIsODZZXP77VbR' -O /tmp/lastbench-claude-design.zip
          test -s /tmp/lastbench-claude-design.zip
          echo '658020389ad977a436e6308fe2fa7948f1d7e3a79547be18f290459ec6df9ff9  /tmp/lastbench-claude-design.zip' | sha256sum -c -

      - name: Extract and verify Claude Design project
        run: |
          set -euo pipefail
          rm -rf /tmp/lastbench-claude-design
          mkdir -p /tmp/lastbench-claude-design
          unzip -q /tmp/lastbench-claude-design.zip -d /tmp/lastbench-claude-design
          test -f '/tmp/lastbench-claude-design/Malaysia Experience v2.dc.html'
          test -f '/tmp/lastbench-claude-design/Last Bench Dashboard.dc.html'
          test -f '/tmp/lastbench-claude-design/Last Bench Mobile App.dc.html'
          test -f '/tmp/lastbench-claude-design/support.js'
          test -f '/tmp/lastbench-claude-design/image-slot.js'
          test -f '/tmp/lastbench-claude-design/_ds/design-system-e48d1fb3-af2d-4eaf-8457-fcbdcd9d040c/tokens/tokens.css'

      - name: Store exact Claude Design source
        run: |
          set -euo pipefail
          DEST='design-source/claude-design/2026-09-08'
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp '/tmp/lastbench-claude-design/Malaysia Experience v2.dc.html' "$DEST/"
          cp '/tmp/lastbench-claude-design/Last Bench Dashboard.dc.html' "$DEST/"
          cp '/tmp/lastbench-claude-design/Last Bench Mobile App.dc.html' "$DEST/"
          cp '/tmp/lastbench-claude-design/support.js' "$DEST/"
          cp '/tmp/lastbench-claude-design/image-slot.js' "$DEST/"
          cp '/tmp/lastbench-claude-design/ios-frame.jsx' "$DEST/"
          cp '/tmp/lastbench-claude-design/github.md' "$DEST/"
          cp -R '/tmp/lastbench-claude-design/_ds' "$DEST/"
          cp -R '/tmp/lastbench-claude-design/ds' "$DEST/"
          cp -R '/tmp/lastbench-claude-design/design_handoff_journey_and_dashboard' "$DEST/"
          cp -R '/tmp/lastbench-claude-design/design_handoff_last_bench' "$DEST/"
          cp -R '/tmp/lastbench-claude-design/assets' "$DEST/"
          cat > "$DEST/PROVENANCE.md" <<'EOF'
          # Verified Claude Design export — 2026-09-08

          Source: user-exported Claude Design Project HTML ZIP.

          Google Drive file id: `1GlFQ6t0A9W3KbDq_7uEIsODZZXP77VbR`

          SHA-256: `658020389ad977a436e6308fe2fa7948f1d7e3a79547be18f290459ec6df9ff9`

          This directory preserves the exported source. Do not silently treat it as newer than current production logic. Production fixes, form handling, security, accessibility, and locked brand assets remain authoritative when they conflict.
          EOF

      - name: Build production-safe Claude Design preview
        run: |
          set -euo pipefail
          mkdir -p landing/claude-design-ds
          cp '/tmp/lastbench-claude-design/support.js' landing/claude-design-support.js
          cp '/tmp/lastbench-claude-design/image-slot.js' landing/claude-design-image-slot.js
          cp '/tmp/lastbench-claude-design/_ds/design-system-e48d1fb3-af2d-4eaf-8457-fcbdcd9d040c/tokens/tokens.css' landing/claude-design-ds/tokens.css
          cp '/tmp/lastbench-claude-design/_ds/design-system-e48d1fb3-af2d-4eaf-8457-fcbdcd9d040c/styles.css' landing/claude-design-ds/styles.css
          python - <<'PY'
          from pathlib import Path
          import re

          src = Path('/tmp/lastbench-claude-design/Malaysia Experience v2.dc.html').read_text()
          out = src
          out = out.replace('<script src="./support.js"></script>', '<script src="./claude-design-support.js"></script>')
          out = out.replace('href="_ds/design-system-e48d1fb3-af2d-4eaf-8457-fcbdcd9d040c/tokens/tokens.css"', 'href="./claude-design-ds/tokens.css"')
          out = out.replace('href="_ds/design-system-e48d1fb3-af2d-4eaf-8457-fcbdcd9d040c/styles.css"', 'href="./claude-design-ds/styles.css"')
          out = out.replace('<script src="./image-slot.js"></script>', '<script src="./claude-design-image-slot.js"></script>')
          out = out.replace('href="Last Bench Dashboard.dc.html"', 'href="/app/"')
          out = out.replace('<title>Last Bench — From Last Bench. To The World.</title>', '<title>Last Bench — Claude Design Preview</title>\n<meta name="description" content="Verified Claude Design export preview for Last Bench.">')

          detector = '''<form name="signup" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" style="display:none" aria-hidden="true">
          <input type="hidden" name="form-name" value="signup">
          <input name="bot-field"><input name="name"><input name="whatsapp"><input name="email"><input name="stage"><input name="field"><input name="contact_consent">
          </form>\n'''
          out = out.replace('<body>\n', '<body>\n' + detector, 1)

          replacement = r'''\n      signUp: () => {
        const nm = (this.state.seatName || '').trim();
        const ct = (this.state.seatContact || '').trim();
        const T = this.state.lang === 'bn';
        if (nm.length < 2) return this.setState({ seatErr: T ? 'আপনার পূর্ণ নাম লিখুন।' : 'Please enter your full name.' });
        const okEmail = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(ct);
        const okPhone = /^[+]?[\\d\\s-]{9,}$/.test(ct);
        if (!okEmail && !okPhone) return this.setState({ seatErr: T ? 'একটি সঠিক ইমেইল বা ফোন নম্বর দিন।' : 'Enter a valid email or phone number.' });
        const payload = new URLSearchParams({
          'form-name': 'signup', name: nm,
          whatsapp: okPhone ? ct : '', email: okEmail ? ct : '',
          stage: 'Claude Design experience', field: '',
          contact_consent: 'Submission confirms WhatsApp/email contact consent'
        });
        fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: payload.toString() })
          .then((res) => { if (!res.ok) throw new Error('Signup failed'); try { localStorage.setItem('lb_student_name', nm); localStorage.setItem('lb_lang', this.state.lang); } catch (_) {} this.setState({ joined: true, seatErr: '' }); })
          .catch(() => this.setState({ seatErr: T ? 'এখন জমা দেওয়া যাচ্ছে না। একটু পরে আবার চেষ্টা করুন।' : 'Could not submit right now. Please try again.' }));
      },
      joined:'''
          pat = re.compile(r'\n\s+signUp:\s*\(\)\s*=>\s*\{.*?\n\s+\},\n\s+joined:', re.S)
          out, count = pat.subn(lambda m: replacement, out, count=1)
          if count != 1:
              raise SystemExit('Could not patch signup handler')
          Path('landing/claude-design-preview.html').write_text(out)
          PY

      - name: Add sync handoff note
        run: |
          cat > CLAUDE_DESIGN_SYNC_STATUS.md <<'EOF'
          # Claude Design sync status

          The verified 2026-09-08 Claude Design export is stored under `design-source/claude-design/2026-09-08/`.

          A production-safe review route is generated at `landing/claude-design-preview.html`.

          The live root `landing/index.html` is intentionally not overwritten by the automation. The user-exported Claude project contains older/non-production behavior in places (including local-only signup behavior), while the current root contains newer production hardening such as Netlify form handling, consent language, accessibility and advisor integrations.

          Promotion rule: visually review the preview against the approved Claude Design project, then port or promote approved sections without deleting newer production protections.
          EOF

      - name: Commit synchronized design source
        run: |
          set -euo pipefail
          git config user.name 'drx-design-sync'
          git config user.email 'drx-design-sync@users.noreply.github.com'
          git add design-source/claude-design/2026-09-08 landing/claude-design-preview.html landing/claude-design-support.js landing/claude-design-image-slot.js landing/claude-design-ds CLAUDE_DESIGN_SYNC_STATUS.md
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'design-sync: import Claude Design export'
          git push origin HEAD:design-sync/claude-lastbench-2026-09-08
