name: Impeccable Design QA

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "design-system/**"
      - "theme.config.js"
      - "design.md"
      - "PRODUCT.md"
      - "SITE_BLUEPRINT.md"
      - "CLAUDE_DESIGN_PHONE_HANDOFF.md"
      - ".agents/skills/impeccable/**"
      - "scripts/validate-brand-lock.mjs"
      - ".agents/skills/last-bench-brand-source-lock/**"
      - ".claude/skills/last-bench-brand-source-lock/**"
      - "skills/last-bench-brand-source-lock/**"
      - "design-system/brand-lock.json"
      - ".github/workflows/impeccable-design-qa.yml"
      - "scripts/impeccable*"
      - "scripts/run-impeccable.mjs"
  pull_request:
    branches: [main]
    paths:
      - "landing/**"
      - "design-system/**"
      - "theme.config.js"
      - "design.md"
      - "PRODUCT.md"
      - "SITE_BLUEPRINT.md"
      - "CLAUDE_DESIGN_PHONE_HANDOFF.md"
      - ".agents/skills/impeccable/**"
      - ".github/workflows/impeccable-design-qa.yml"
      - "scripts/impeccable*"
      - "scripts/run-impeccable.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0

      - name: Run pinned Impeccable detector and reviewed release gate
        id: detector
        run: node scripts/run-impeccable.mjs --output-dir "$RUNNER_TEMP/impeccable"

      - name: Upload detector report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: impeccable-design-report
          path: |
            ${{ runner.temp }}/impeccable/findings.json
            ${{ runner.temp }}/impeccable/versions.json
            ${{ runner.temp }}/impeccable/summary.json
            ${{ runner.temp }}/impeccable/diagnostics.log
          if-no-files-found: warn
          retention-days: 14
