name: Impeccable Design QA

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "design-system/**"
      - "theme.config.js"
      - "design.md"
      - "PRODUCT.md"
      - "SITE_BLUEPRINT.md"
      - "CLAUDE_DESIGN_PHONE_HANDOFF.md"
      - ".agents/skills/impeccable/**"
      - ".github/workflows/impeccable-design-qa.yml"
  pull_request:
    branches: [main]
    paths:
      - "landing/**"
      - "design-system/**"
      - "theme.config.js"
      - "design.md"
      - "PRODUCT.md"
      - "SITE_BLUEPRINT.md"
      - "CLAUDE_DESIGN_PHONE_HANDOFF.md"
      - ".agents/skills/impeccable/**"
      - ".github/workflows/impeccable-design-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Run Impeccable detector
        id: detector
        shell: bash
        run: |
          set +e
          npx --yes impeccable@latest detect --json landing > impeccable-report.json
          status=$?
          set -e
          cat impeccable-report.json
          echo "detector_exit=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" != "0" && "$status" != "2" ]]; then
            echo "::error::Impeccable detector failed unexpectedly with exit $status"
            exit "$status"
          fi

      - name: Upload detector report
        uses: actions/upload-artifact@v7
        with:
          name: impeccable-design-report
          path: impeccable-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Summarize detector state
        shell: bash
        run: |
          if [[ "${{ steps.detector.outputs.detector_exit }}" == "0" ]]; then
            echo "Impeccable detector found no deterministic issues."
          else
            echo "Impeccable detector found reviewable issues. This diagnostic job remains green until findings are triaged against the locked brand system."
          fi
