name: Last Bench blueprint alignment QA

on:
  push:
    branches:
      - fix/lastbench-blueprint-alignment
    paths:
      - landing/bench-ai.js
      - landing/lastbench-blueprint.js
      - PRODUCT.md
      - design.md
      - .github/workflows/blueprint-alignment-qa.yml
  pull_request:
    branches: [main]
    paths:
      - landing/bench-ai.js
      - landing/lastbench-blueprint.js
      - PRODUCT.md
      - design.md
      - .github/workflows/blueprint-alignment-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blueprint-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Static product-contract checks
        run: |
          set -euo pipefail
          grep -q 'Student Accelerator' PRODUCT.md
          grep -q 'DISCOVER' PRODUCT.md
          grep -q 'ARRIVE' PRODUCT.md
          grep -q 'study, settle and succeed' PRODUCT.md
          grep -q '#00C853' design.md
          if grep -q 'historical teal palette.*is.*current' design.md; then exit 1; fi
          grep -q 'lastbench-blueprint.js' landing/bench-ai.js
          grep -q 'STUDY. SETTLE.' landing/lastbench-blueprint.js
          grep -q 'UNIVERSITY EXPLORER' landing/lastbench-blueprint.js
          grep -q 'OPEN JOURNEY OS' landing/lastbench-blueprint.js
          grep -q 'not a claim that every listed institution is a current Last Bench partner' landing/lastbench-blueprint.js

      - name: Install isolated Playwright and Chromium
        run: |
          mkdir -p /tmp/lbp-pw
          cd /tmp/lbp-pw
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static landing site
        run: |
          cd landing
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/lbp-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/lbp-http.log
          exit 1

      - name: Render desktop and mobile business logic
        run: |
          cat >/tmp/lbp-pw/qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const cases = [
            {name:'desktop', viewport:{width:1440,height:1000}},
            {name:'mobile', viewport:{width:390,height:844}, mobile:true},
          ];
          const report=[];
          for (const c of cases) {
            const context=await browser.newContext({viewport:c.viewport,isMobile:!!c.mobile,deviceScaleFactor:1});
            const page=await context.newPage();
            const errors=[];
            const badResponses=[];
            const failedRequests=[];
            page.on('console', m => { if (m.type()==='error') errors.push(m.text()); });
            page.on('pageerror', e => errors.push('pageerror: '+e.message));
            page.on('response', r => { if (r.status() >= 400) badResponses.push({status:r.status(),url:r.url()}); });
            page.on('requestfailed', r => failedRequests.push({url:r.url(),failure:r.failure()?.errorText||'unknown'}));
            const response=await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(5000);
            const journey=page.locator('#lb-journey-os');
            const beyond=page.locator('#lb-beyond-arrival');
            const universityNote=page.locator('.lbp-university-note');
            const portal=page.locator('.lb-class-portal');
            const launcher=page.locator('.lb-ai-launcher');
            const bodyText=await page.locator('body').innerText();
            const checks={
              status:response?.status(),
              aligned:await page.locator('html[data-business-blueprint-aligned="2026-09-10"]').count(),
              journey:await journey.count(),
              beyond:await beyond.count(),
              universityNote:await universityNote.count(),
              portalHref:await portal.getAttribute('href'),
              journeyText:(await journey.innerText()).includes('DISCOVER') && (await journey.innerText()).includes('ARRIVE'),
              classDeemphasized:(await portal.getAttribute('href'))==='#lb-journey-os',
              noFalsePartnerClaim:!bodyText.includes('the fifteen campuses Last Bench works with'),
              researchList:bodyText.includes('ONE RESEARCH LIST.'),
              benchAi:await launcher.count(),
            };
            if (await launcher.count()) {
              await launcher.click();
              await page.waitForTimeout(200);
              checks.benchAiOpened=await page.locator('.lb-ai-panel[data-open="true"]').count();
            }
            const out=`${process.env.GITHUB_WORKSPACE}/blueprint-${c.name}.png`;
            await page.screenshot({path:out,fullPage:false});
            report.push({name:c.name,checks,errors,badResponses,failedRequests});
            await context.close();
          }
          fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/blueprint-report.json`,JSON.stringify(report,null,2));
          await browser.close();
          JS
          cd /tmp/lbp-pw
          node qa.mjs
          cd "$GITHUB_WORKSPACE"
          cat blueprint-report.json

      - name: Enforce blueprint alignment
        run: |
          python - <<'PY'
          import json
          rows=json.load(open('blueprint-report.json'))
          failures=[]
          for row in rows:
              c=row['checks']
              required=['aligned','journey','beyond','universityNote','journeyText','classDeemphasized','noFalsePartnerClaim','researchList','benchAi','benchAiOpened']
              for key in required:
                  if not c.get(key): failures.append(f"{row['name']}: {key} failed")
              if c.get('status') != 200: failures.append(f"{row['name']}: HTTP {c.get('status')}")
              if row['errors']: failures.append(f"{row['name']}: console errors {row['errors']}")
              if row['badResponses']: failures.append(f"{row['name']}: bad responses {row['badResponses']}")
              if row['failedRequests']: failures.append(f"{row['name']}: failed requests {row['failedRequests']}")
          if failures: raise SystemExit('\n'.join(failures))
          print('Blueprint alignment passed on desktop and mobile.')
          PY

      - name: Upload blueprint QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lastbench-blueprint-alignment-qa
          path: |
            blueprint-*.png
            blueprint-report.json
          if-no-files-found: warn
          retention-days: 3
