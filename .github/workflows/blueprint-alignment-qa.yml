name: Last Bench blueprint alignment QA

on:
  pull_request:
    branches: [main]
    paths:
      - PRODUCT.md
      - design.md
      - AGENT.md
      - AGENTS.md
      - README.md
      - .github/workflows/blueprint-alignment-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blueprint-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Verify canonical opportunity-accelerator contract
        run: |
          set -euo pipefail
          grep -q 'Opportunity Accelerator' PRODUCT.md
          grep -q 'Education & Mobility' PRODUCT.md
          grep -q 'CLASS\[Λ\]' PRODUCT.md
          grep -q 'co.lab' PRODUCT.md
          grep -q 'Malaysia is an active education/mobility service and market' PRODUCT.md
          grep -q 'not the corporate backbone or definition of Last Bench' PRODUCT.md
          grep -q 'Multiple entry points' PRODUCT.md
          grep -q 'ACCESS' PRODUCT.md
          grep -q 'OWNERSHIP' PRODUCT.md
          grep -q 'Opportunity Accelerator' design.md
          grep -q '#00C853' design.md
          grep -q 'Malaysia Admissions is one current active service inside Education & Mobility' AGENT.md
          grep -q 'Opportunity Accelerator' README.md

      - name: Reject known parent-brand drift
        run: |
          set -euo pipefail
          if grep -q '^\*\*Student Accelerator.*technology-enabled journey platform' PRODUCT.md; then
            echo 'PRODUCT.md has regressed to the retired parent category.'
            exit 1
          fi
          if grep -q 'Malaysia.*corporate backbone' PRODUCT.md | grep -vq 'not the corporate backbone'; then
            echo 'Malaysia has been promoted back to parent-company backbone.'
            exit 1
          fi
          echo 'Opportunity Accelerator architecture checks passed.'
