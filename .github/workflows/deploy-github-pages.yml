name: Deploy GitHub Pages Production

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-github-pages.yml"
      - "landing/**"
      - "app/**"
      - "assets/**"
      - "scripts/build-site.mjs"
      - "scripts/validate-public-env.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_API_BASE_URL: https://api.lastbenchbd.com
      EXPO_PUBLIC_SUPABASE_URL: https://tocxdyqlrvzthpexnmxe.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_uLq6k_t3B-dnNJW9d1Kh-Q_3kyoSUa_
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build exact production site
        run: pnpm build:web:production
      - name: Configure custom domain artifact
        run: printf '%s\n' 'lastbenchbd.com' > dist/CNAME
      - name: Upload immutable build evidence
        uses: actions/upload-artifact@v7
        with:
          name: lastbench-production-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy exact artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
