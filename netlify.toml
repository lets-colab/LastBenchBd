# One site, one host: the cinematic landing is the front door at /,
# the student app (Expo web, base URL /app) lives at /app.

[build]
  command = "pnpm build:web:production"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9.12.0"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Pull-request previews use non-production endpoints so review builds stay
# deterministic without touching the real student identity store.
[context.deploy-preview.environment]
  EXPO_PUBLIC_API_BASE_URL = "https://api.example.invalid"
  EXPO_PUBLIC_SUPABASE_URL = "https://preview-project.supabase.co"
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "preview-publishable-key"

# Public client configuration. Supabase publishable keys are intentionally safe
# to expose to clients; authorization is enforced by Auth + RLS, never by hiding
# this value in the static bundle.
[context.production.environment]
  EXPO_PUBLIC_API_BASE_URL = "https://api.lastbenchbd.com"
  EXPO_PUBLIC_SUPABASE_URL = "https://tocxdyqlrvzthpexnmxe.supabase.co"
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_uLq6k_t3B-dnNJW9d1Kh-Q_3kyoSUa_"

# SPA fallback for the app's client-side routes (/app/profile, /app/admin, …).
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Landing catch-all (real files — thanks.html, assets, vendor — win automatically).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
